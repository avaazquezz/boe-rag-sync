server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # add_header is not inherited by a location that sets its own, so each location lists its headers.

  # Hashed build assets and fonts never change under the same name.
  location ~ ^/(_nuxt|_fonts)/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Pages revalidate on every visit so a deploy is seen at once.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri $uri/index.html $uri.html =404;
  }

  error_page 404 /404.html;
}
